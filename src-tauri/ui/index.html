<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>autopilotmode</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- The whole card is the drag handle: the window is borderless, so there is no title
         bar to grab. Tauri hit-tests the exact element under the pointer, so the controls
         below still receive their own clicks without opting out. -->
    <main class="card mood-idle" id="card" data-tauri-drag-region>
      <header data-tauri-drag-region>
        <!-- Inlined rather than <img src="logo-mark.svg"> so the glow filter can follow the
             mark's actual silhouette instead of its bounding box. Vector at every DPI —
             none of the downscaling or premultiplied-alpha trouble a raster mark has. -->
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 336 208" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="28" width="320" height="152" rx="76" fill="var(--mood)" />
            <circle cx="92" cy="83" r="22" fill="#0b1a14" fill-opacity=".42" />
            <path d="M57 145a35 35 0 0170 0z" fill="#0b1a14" fill-opacity=".42" />
            <circle cx="244" cy="104" r="61" fill="#fff" />
            <path d="M244 72V54" stroke="var(--mood)" stroke-width="9" stroke-linecap="round" />
            <circle cx="244" cy="49" r="8" fill="var(--mood)" stroke="#fff" stroke-width="6" />
            <rect x="212" y="78" width="64" height="52" rx="17" fill="var(--mood)" />
            <circle cx="231" cy="104" r="7.5" fill="#fff" />
            <circle cx="257" cy="104" r="7.5" fill="#fff" />
          </svg>
        </div>

        <div class="identity" data-tauri-drag-region>
          <div class="wordmark">autopilot<span>mode</span></div>
          <div class="pills">
            <span class="pill" id="status">ready</span>
            <!-- Always visible, deliberately. This program can move the real mouse and type
                 real keystrokes; that it has had no security review is something the user
                 should be able to see at a glance, not something buried in a doc. -->
            <span class="pill tag" title="Not security-audited. It can control your real mouse and keyboard — run it on a machine you're willing to have driven.">unaudited</span>
          </div>
        </div>

        <!-- Body ring + hub + teeth that start *on* the ring. The classic cog outline turns
             to mush at 16px, and teeth radiating from a small centre circle read as a
             brightness icon rather than a gear — the ring is what makes it legible. -->
        <button class="icon-btn ghost" id="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="6.9" />
            <circle cx="12" cy="12" r="2.6" />
            <path d="M12 5.1V2.7M12 18.9v2.4M18.9 12h2.4M5.1 12H2.7
                     M16.88 7.12l1.7-1.7M7.12 16.88l-1.7 1.7
                     M16.88 16.88l1.7 1.7M7.12 7.12l-1.7-1.7" />
          </svg>
        </button>
        <button class="close" id="close" title="Close" aria-label="Close">&times;</button>
      </header>

      <!-- Settings live over the card rather than beside it: the window is small, and a
           pane you dismiss beats a layout that has to fit both at once. -->
      <section class="settings" id="panel" hidden>
        <div class="settings-head">
          <h2>Settings</h2>
          <button class="close" id="panel-close" title="Back" aria-label="Back">&times;</button>
        </div>

        <label for="provider">Provider</label>
        <select id="provider">
          <option value="anthropic">Anthropic — direct</option>
          <option value="openrouter">OpenRouter — many models, one key</option>
        </select>

        <!-- One key row at a time. Whichever provider is selected is the only credential
             that affects a run, and showing both invites pasting into the wrong one. -->
        <div id="key-anthropic">
          <label for="key">Anthropic API key</label>
          <div class="key-row">
            <input id="key" type="password" autocomplete="off" spellcheck="false"
                   placeholder="sk-ant-api…" />
            <button class="icon-btn ghost" id="reveal" type="button" title="Show key" aria-label="Show key">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                <circle cx="12" cy="12" r="2.8" />
              </svg>
            </button>
          </div>
        </div>

        <div id="key-openrouter" hidden>
          <label for="orkey">OpenRouter API key</label>
          <div class="key-row">
            <input id="orkey" type="password" autocomplete="off" spellcheck="false"
                   placeholder="sk-or-v1-…" />
            <button class="icon-btn ghost" id="orreveal" type="button" title="Show key" aria-label="Show key">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                <circle cx="12" cy="12" r="2.8" />
              </svg>
            </button>
          </div>
        </div>
        <p class="hint" id="key-state"></p>

        <div class="grid">
          <div>
            <label for="model">Model</label>
            <input id="model" type="text" autocomplete="off" spellcheck="false"
                   placeholder="claude-opus-5" />
          </div>
          <div>
            <label for="steps">Max steps</label>
            <input id="steps" type="text" inputmode="numeric" autocomplete="off" placeholder="25" />
          </div>
          <div>
            <label for="effort">Effort</label>
            <select id="effort">
              <option value="">default (low)</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
              <option value="max">max</option>
            </select>
          </div>
        </div>

        <div class="section">Voice</div>

        <label for="vkey">ElevenLabs key — for the microphone</label>
        <div class="key-row">
          <input id="vkey" type="password" autocomplete="off" spellcheck="false"
                 placeholder="Optional — needed for the microphone" />
          <button class="icon-btn ghost" id="vreveal" type="button" title="Show key" aria-label="Show key">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
              <circle cx="12" cy="12" r="2.8" />
            </svg>
          </button>
        </div>
        <p class="hint" id="vkey-state"></p>

        <label for="micsel">Microphone</label>
        <select id="micsel"><option value="">System default</option></select>

        <div class="voice-row">
          <button class="switch" id="vout" role="switch" aria-checked="false" aria-label="Speak replies">
            <span class="knob"></span>
          </button>
          <span class="mode" id="vout-label">Speak replies</span>
          <select id="vengine" title="Which voice speaks the replies">
            <option value="system">System voice (free)</option>
            <option value="elevenlabs">ElevenLabs</option>
          </select>
          <button class="link" id="vtest" type="button" title="Hear the selected voice">Test</button>
        </div>

        <!-- Only shown for ElevenLabs; the system voice has nothing to choose. -->
        <div class="voice-row" id="voice-pick" hidden>
          <label for="vvoice" class="inline">Voice</label>
          <select id="vvoice"><option value="">Default</option></select>
        </div>

        <p class="hint" id="env-path"></p>

        <div class="row settings-actions">
          <button class="link" id="repo" type="button" title="github.com/vishalch4466/autopilotmode">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.6l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9l6.1-.8z" />
            </svg>
            Star on GitHub
          </button>
          <span class="note" id="saved"></span>
          <button class="go" id="save">Save</button>
        </div>
      </section>

      <!-- The transcript. One entry per thing that happened, screenshots included, so a run
           that went wrong can be read back rather than reconstructed. -->
      <div class="log" id="log">
        <div class="msg bot">
          <p>Hi! Tell me what to do and I'll drive.</p>
        </div>
      </div>

      <div class="row">
        <button class="icon-btn" id="mic" title="Hold to talk, or tap for hands-free" aria-label="Hold to talk, or tap for hands-free">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="10" rx="3" fill="currentColor" stroke="none" />
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
            <path d="M12 17.5V21M8.5 21h7" />
          </svg>
        </button>
        <input id="goal" type="text" placeholder="Tell me what to do" autocomplete="off" spellcheck="false" />
        <button class="go" id="go" disabled>Go</button>
        <!-- Swaps in for Go while a run is in flight. A window that can seize the mouse
             must offer a way out that is not "throw the cursor into the corner". -->
        <button class="stop" id="stop" hidden>Stop</button>
      </div>

      <!-- Model picker. Only for OpenRouter, where the choice is the whole point of the
           provider; on the Anthropic path there is one model and it lives in settings.
           Sits here rather than behind the gear because swapping models between runs is a
           thing you do constantly — a different model is often the answer to a run that
           went wrong, and you have just watched it go wrong on this screen. -->
      <div class="row model-row" id="model-row" hidden>
        <span class="model-label">Model</span>
        <select id="modelsel" title="Which model drives the loop"></select>
      </div>

      <div class="row footer">
        <button class="switch is-on" id="dry" role="switch" aria-checked="true" aria-label="Dry run">
          <span class="knob"></span>
        </button>
        <span class="mode" id="mode">Dry run</span>
        <span class="note" id="note">won't touch your mouse</span>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
