[package]
name = "autopilotmode-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop front-end for autopilotmode — a webview UI over the same agent loop."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The agent itself. This crate contributes a UI and nothing else: no capture, no input
# injection, no model calls. Anything that would need reimplementing here belongs in the
# library instead.
autopilotmode = { path = ".." }
tauri = { version = "2", features = [] }
# Opening a URL in the user's browser. The official plugin rather than a hand-rolled
# `rundll32`/`ShellExecute` call: it is the supported path and already handles the
# per-platform differences correctly.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loading `.env` is the front-end's job, same as in the CLI — the library reads the
# environment and does not care how it got populated.
dotenvy = "0.15"

# Voice. Capture runs in Rust because the webview cannot enumerate or pin a specific input
# device, and "which microphone" is exactly the setting users need.
cpal = "0.15"
hound = "3"
anyhow = "1"
base64 = "0.22"
# `multipart` for the speech-to-text upload; the workspace's other reqwest use does not
# need it, so the feature is enabled only here.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
] }

[features]
# Tauri's own convention — the CLI passes this for production builds.
custom-protocol = ["tauri/custom-protocol"]
